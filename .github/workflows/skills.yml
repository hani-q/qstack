name: Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.20.0

      - name: Install the Agent Skills reference validator
        run: >-
          python3 -m pip install
          "git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"

      - name: Validate every skill against the specification
        run: |
          for skill in skills/*; do
            if [ -f "$skill/SKILL.md" ]; then
              skills-ref validate "$skill"
            fi
          done

      - name: Verify skills.sh CLI discovery
        run: npx --yes skills@1.5.21 add . --list --agent codex
