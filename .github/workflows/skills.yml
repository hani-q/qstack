name: Skills

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Validate plan template sync
        run: scripts/validate-template-sync

      - name: Validate the board fold against its fixture
        run: scripts/validate-board-fold

      - name: Validate branch-scoped versioning
        run: scripts/test-versioning

      - name: Install the Agent Skills reference validator
        run: >-
          python3 -m pip install
          "git+https://github.com/agentskills/agentskills.git@38a2ff82958afee88dadf4831509e6f7e9d8ef4e#subdirectory=skills-ref"

      - name: Validate skill metadata and invocation parity
        run: scripts/validate-skill-invocation

      - name: Verify skills.sh CLI discovery
        run: npx --yes skills@1.5.23 add . --list --agent codex

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: skills-sh-publish
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Publish current release to skills.sh
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          release=$(tr -d '[:space:]' < version.txt)
          publish_dir="$RUNNER_TEMP/skills-sh-publish"
          mkdir -p "$publish_dir"
          cd "$publish_dir"

          npm exec --yes --package=skills@1.5.23 -- skills add \
            "$GITHUB_REPOSITORY" \
            --skill '*' \
            --agent codex \
            --copy \
            --yes \
            --metadata "{\"origin\":\"github-actions\",\"release\":\"$release\",\"commit\":\"$GITHUB_SHA\"}"

      - name: Verify published skills.sh snapshots
        run: |
          snapshot_dir="$RUNNER_TEMP/skills-sh-snapshots"
          mkdir -p "$snapshot_dir"

          for attempt in $(seq 1 15); do
            unmatched=()

            for skill_file in skills/*/SKILL.md; do
              slug=$(basename "$(dirname "$skill_file")")
              response="$snapshot_dir/$slug.json"
              published="$snapshot_dir/$slug.SKILL.md"

              if ! curl --fail --silent \
                "https://skills.sh/api/download/$GITHUB_REPOSITORY/$slug" \
                --output "$response"; then
                unmatched+=("$slug")
                continue
              fi

              if ! jq --exit-status '.files | type == "array"' "$response" >/dev/null; then
                unmatched+=("$slug")
                continue
              fi

              jq --join-output \
                '.files[] | select(.path == "SKILL.md") | .contents' \
                "$response" > "$published"
              cmp --silent "$skill_file" "$published" || unmatched+=("$slug")
            done

            if [ "${#unmatched[@]}" -eq 0 ]; then
              echo "skills.sh matches all published skill snapshots."
              exit 0
            fi

            if [ "$attempt" -lt 15 ]; then
              echo "Waiting for skills.sh to publish ${#unmatched[@]} skill snapshots."
              sleep 20
            fi
          done

          echo "skills.sh did not publish the current snapshots: ${unmatched[*]}" >&2
          exit 1
